<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="description" content="Five-day hybrid lifting program and workout log.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Build Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Lean Build Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone column, a single loud action per screen, big condensed numerals, bottom tabs, sheets for everything secondary. Single dark theme by choice. */
:root {
  color-scheme: dark;
  --bg: #0a0a0c;
  --s1: #131317;
  --s2: #1b1b21;
  --s3: #26262e;
  --line: #2b2b34;
  --text: #f5f5f6;
  --t2: #a9a9b4;
  --t3: #72727e;
  --accent: #ff5a1f;
  --accent-ink: #0a0a0c;
  --good: #36d07f;
  --warn: #ffc247;
  --bad: #ff4d5e;
  --good-ink: #062313;
  --glass: 10,10,12;
  --fd: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --fb: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 14px;
  --nav-h: 62px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--fb); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
#app { max-width: 680px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(var(--nav-h) + 28px); }
body.timer-on #app { padding-bottom: calc(var(--nav-h) + 110px); }
body.has-resume #app { padding-bottom: calc(var(--nav-h) + 92px); }
body.in-workout #app { padding-bottom: 40px; }
body.in-workout.timer-on #app { padding-bottom: 120px; }

/* Top bar */
#top { position: sticky; top: 0; z-index: 20; background: rgba(var(--glass), .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 56px; }
.topbar .title { font-family: var(--fd); font-weight: 800; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .title small { display: block; font-family: var(--fb); font-size: 11.5px; font-weight: 600; letter-spacing: .08em; color: var(--t3); margin-top: 3px; }
.logo { width: 30px; height: 30px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--s2); border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--t2); white-space: nowrap; }
.chip b { color: var(--text); }
.chip.acc { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.good { color: var(--good); border-color: rgba(54,208,127,.4); }
.chip.warn { color: var(--warn); border-color: rgba(255,194,71,.4); }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--s2); border: 1px solid var(--line); flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.progressbar { height: 3px; background: var(--s2); }
.progressbar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 12px; background: var(--s2); border: 1px solid var(--line); font-weight: 600; font-size: 14.5px; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { width: 100%; min-height: 56px; font-family: var(--fd); font-size: 22px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn svg { width: 16px; height: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

/* Shell */
#view { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.card h3 { font-family: var(--fd); font-weight: 700; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 10px; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--t3); }
.eyebrow.acc { color: var(--accent); }
.muted { color: var(--t2); }
.dim { color: var(--t3); }
.small { font-size: 13px; }
.num { font-family: var(--fd); font-weight: 800; font-variant-numeric: tabular-nums; line-height: .95; }

/* Hero */
.hero { position: relative; overflow: hidden; background: linear-gradient(160deg, var(--s2), var(--s1) 60%); border: 1px solid var(--line); border-radius: 20px; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.hero::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--accent); }
.hero h1 { font-family: var(--fd); font-weight: 800; font-size: clamp(44px, 13vw, 64px); line-height: .9; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
.hero .meta { display: flex; gap: 18px; flex-wrap: wrap; }
.hero .meta div { font-size: 12px; color: var(--t3); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.hero .meta b { display: block; font-family: var(--fd); font-size: 30px; font-weight: 800; color: var(--text); line-height: 1; letter-spacing: 0; }
.peek { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.peek li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--t2); border-top: 1px solid var(--line); padding-top: 6px; }
.peek li span:last-child { font-family: var(--fd); font-weight: 700; font-size: 16px; color: var(--text); white-space: nowrap; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .num { font-size: 32px; }
.tile .num small { font-size: 15px; font-weight: 600; color: var(--t3); margin-left: 3px; }
.tile .eyebrow { font-size: 10.5px; }

/* Day list */
.daylist { display: flex; flex-direction: column; gap: 8px; }
.dayrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.dayrow .ix { width: 38px; height: 38px; border-radius: 10px; background: var(--s2); display: grid; place-items: center; font-family: var(--fd); font-weight: 800; font-size: 20px; flex: none; color: var(--t2); }
.dayrow.done .ix { background: rgba(54,208,127,.14); color: var(--good); }
.dayrow.next { border-color: var(--accent); }
.dayrow.next .ix { background: var(--accent); color: var(--accent-ink); }
.dayrow .nm { font-family: var(--fd); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; line-height: 1.05; }
.dayrow .sub { font-size: 12.5px; color: var(--t3); }
.dayrow svg.chev { width: 16px; height: 16px; color: var(--t3); flex: none; }

/* Block card */
.blockcard { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.rir { text-align: center; padding: 6px 14px; border-radius: 12px; background: var(--s2); }
.rir .num { font-size: 40px; color: var(--accent); }
.weekdots { display: flex; gap: 5px; margin-top: 10px; }
.weekdots i { flex: 1; height: 5px; border-radius: 3px; background: var(--s3); }
.weekdots i.on { background: var(--accent); }
.weekdots i.cur { background: var(--text); }
.banner { background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 14px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-weight: 600; }
.banner .btn { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }

/* Workout */
.hint { font-size: 12.5px; color: var(--t3); padding: 0 2px; }
.ex { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ex.complete { border-color: rgba(54,208,127,.35); }
.ex.ss { border-left: 4px solid var(--accent); }
.ex-head { padding: 14px 14px 10px; display: flex; gap: 12px; align-items: flex-start; }
.ex-head .ix { font-family: var(--fd); font-weight: 800; font-size: 26px; color: var(--t3); line-height: 1; width: 22px; flex: none; }
.ex.complete .ex-head .ix { color: var(--good); }
.ex-name { font-family: var(--fd); font-weight: 700; font-size: 23px; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em; text-align: left; text-wrap: balance; }
.ex-target { font-size: 13px; color: var(--t2); margin-top: 3px; }
.ex-target b { color: var(--text); }
.ex-tools { display: flex; gap: 6px; flex: none; }
.ex-tools .iconbtn { width: 36px; height: 36px; border-radius: 10px; }
.ex-tools .iconbtn svg { width: 17px; height: 17px; }
.coach { margin: 0 14px 10px; padding: 9px 12px; border-radius: 10px; background: var(--s2); font-size: 13.5px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.coach .tag { font-family: var(--fd); font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
.coach.up .tag { color: var(--good); }
.coach.reset .tag { color: var(--warn); }
.pin { margin: 0 14px 10px; }
.pin input { width: 100%; background: transparent; border: 0; border-bottom: 1px dashed var(--line); padding: 4px 0; font-size: 13px; color: var(--t2); }
.pin input::placeholder { color: var(--t3); }
.sets { padding: 0 10px; }
.sethead, .set { display: grid; grid-template-columns: 38px minmax(64px, 1fr) minmax(64px, 1fr) minmax(54px, .8fr) 48px; gap: 8px; align-items: center; }
.sethead { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); padding: 0 4px 6px; text-align: center; }
.set { padding: 5px 4px; border-radius: 12px; }
.set.done { background: rgba(54,208,127,.09); }
.set .sn { height: 40px; border-radius: 10px; background: var(--s2); font-family: var(--fd); font-weight: 800; font-size: 19px; }
.set.warm .sn { color: var(--warn); }
.set .prev { height: 40px; font-size: 13.5px; color: var(--t3); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set input { width: 100%; height: 44px; text-align: center; background: var(--s2); border: 1px solid var(--line); border-radius: 10px; font-family: var(--fd); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; padding: 0 4px; }
.set input:focus { border-color: var(--accent); outline: none; }
.set.done input { background: transparent; border-color: transparent; }
.set .ck { width: 48px; height: 44px; border-radius: 12px; background: var(--s3); display: grid; place-items: center; color: var(--t3); }
.set .ck svg { width: 22px; height: 22px; }
.set.done .ck { background: var(--good); color: var(--good-ink); }
.set .pr { grid-column: 1 / -1; font-size: 12px; font-weight: 700; color: var(--warn); letter-spacing: .06em; text-transform: uppercase; padding-left: 46px; margin-top: -2px; }
.techrow { margin: 8px 14px 0; padding: 9px 12px; border-radius: 10px; border: 1px dashed var(--accent); font-size: 13px; color: var(--t2); }
.techrow b { color: var(--accent); font-family: var(--fd); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
.ex-foot { display: flex; gap: 8px; padding: 10px 14px 14px; flex-wrap: wrap; }
.sslabel { padding: 8px 14px 0; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
textarea.notes { width: 100%; min-height: 72px; background: var(--s2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; }

/* Focus pager */
.pager { display: flex; align-items: center; gap: 10px; }
.pager .mid { flex: 1; min-width: 0; text-align: center; }
.dots { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-top: 2px; }
.dots button { width: 22px; height: 20px; padding: 7px 0; background: var(--s3); background-clip: content-box; border-radius: 3px; }
.dots button.done { background-color: var(--good); }
.dots button.cur { background-color: var(--accent); width: 32px; }
.demo-frames.wide { aspect-ratio: 16 / 9; }
.themes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.themebtn { border-radius: 12px; border: 2px solid var(--line); padding: 10px; text-align: left; display: flex; flex-direction: column; gap: 8px; font-weight: 600; }
.themebtn.on { border-color: var(--accent); }
.themebtn i { display: block; height: 24px; border-radius: 6px; }
.swatches { flex-wrap: wrap; }

/* Rest timer */
#timer { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + 8px); z-index: 30; padding: 0 12px; pointer-events: none; }
body.in-workout #timer { bottom: 12px; }
.timerbox { pointer-events: auto; max-width: 656px; margin: 0 auto; background: var(--s3); border: 1px solid var(--accent); border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.6); position: relative; overflow: hidden; }
.timerbox .t { font-family: var(--fd); font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 96px; }
.timerbox .l { flex: 1; min-width: 0; font-size: 12.5px; color: var(--t2); }
.timerbox .l b { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.timerbox .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0; }
#timer.over .timerbox { background: var(--accent); color: var(--accent-ink); }
#timer.over .timerbox .l, #timer.over .timerbox .l b { color: var(--accent-ink); }
.timerbox .btn.sm { min-width: 44px; padding: 6px 8px; }

/* Resume bar */
#resume { position: fixed; left: 0; right: 0; bottom: var(--nav-h); z-index: 25; padding: 0 12px 8px; }
#resume button { width: 100%; max-width: 656px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 10px 16px; font-weight: 700; }
#resume .num { font-size: 24px; }
body.timer-on #resume { display: none; }

/* Nav */
#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 26; background: rgba(var(--glass), .96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); height: var(--nav-h); }
#nav .in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: 100%; }
#nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--t3); }
#nav button svg { width: 22px; height: 22px; }
#nav button.on { color: var(--accent); }
body.in-workout #nav, body.in-workout #resume { display: none; }

/* Segments */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--s1); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { min-height: 38px; border-radius: 9px; font-weight: 600; font-size: 13.5px; color: var(--t2); }
.seg button.on { background: var(--s3); color: var(--text); }

/* Charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--fb); font-size: 11px; fill: var(--t3); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal .h { font-size: 10.5px; font-weight: 700; color: var(--t3); text-align: center; letter-spacing: .08em; }
.cal .d { aspect-ratio: 1; border-radius: 9px; background: var(--s2); display: grid; place-items: center; font-size: 12px; color: var(--t3); font-variant-numeric: tabular-nums; }
.cal .d.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.cal .d.today { outline: 2px solid var(--text); outline-offset: -2px; }
.cal .d.future { opacity: .35; }
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar { display: grid; grid-template-columns: 92px 1fr 54px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 10px; border-radius: 5px; background: var(--s3); overflow: hidden; }
.bar .track i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--t2); }
.list { display: flex; flex-direction: column; }
.li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .v { font-family: var(--fd); font-weight: 700; font-size: 18px; white-space: nowrap; font-variant-numeric: tabular-nums; }
select, .field { width: 100%; min-height: 44px; background: var(--s2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.hist { width: 100%; text-align: left; }
.hist-body { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
.hist-body .e b { display: block; }
.hist-body .e span { color: var(--t2); font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--t3); padding: 22px 10px; font-size: 14px; }

/* Program */
.prose { display: flex; flex-direction: column; gap: 10px; color: var(--t2); font-size: 14.5px; max-width: 65ch; }
.prose strong { color: var(--text); }
.prose ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; }
.who { display: grid; gap: 10px; }
.who .p { background: var(--s2); border-radius: 12px; padding: 12px 14px; }
.who .p b { font-family: var(--fd); font-size: 19px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; display: block; }
.who .p .take { color: var(--text); font-size: 14px; }
.who .p .skip { color: var(--t3); font-size: 13px; margin-top: 4px; }
.sched { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.sched div { background: var(--s2); border-radius: 9px; padding: 8px 2px; text-align: center; font-size: 10.5px; color: var(--t3); font-weight: 700; letter-spacing: .06em; }
.sched div b { display: block; font-family: var(--fd); font-size: 17px; color: var(--text); letter-spacing: 0; margin-top: 2px; }
.sched div.off b { color: var(--t3); }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th, table.t td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
table.t th { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); border-top: 0; }
.slot { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.slot:first-child { border-top: 0; }
.slot .r { font-family: var(--fd); font-weight: 700; font-size: 17px; white-space: nowrap; text-align: right; }
.slot .r small { display: block; font-family: var(--fb); font-weight: 500; font-size: 11.5px; color: var(--t3); }
.slot .n small { display: block; color: var(--t3); font-size: 12px; }

/* Settings */
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.setrow:first-of-type { border-top: 0; }
.setrow .lab small { display: block; color: var(--t3); font-size: 12.5px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper b { font-family: var(--fd); font-size: 24px; min-width: 34px; text-align: center; }
.toggle { width: 52px; height: 30px; border-radius: 15px; background: var(--s3); position: relative; flex: none; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--t2); transition: transform .15s; }
.toggle[aria-pressed="true"] { background: var(--accent); }
.toggle[aria-pressed="true"]::after { transform: translateX(22px); background: var(--accent-ink); }
.swatches { display: flex; gap: 8px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; }
.swatch.on { border-color: var(--text); }

/* Sheet */
#sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
#sheet[hidden] { display: none; }
.sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.66); }
.sheet-body { position: relative; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; background: var(--s1); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.sheet-body::before { content: ''; width: 44px; height: 4px; border-radius: 2px; background: var(--s3); align-self: center; flex: none; }
.sheet-body h2 { font-family: var(--fd); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.opt { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; background: var(--s2); border: 1px solid var(--line); }
.opt.on { border-color: var(--accent); }
.opt small { display: block; color: var(--t3); font-size: 12.5px; }
.optlist { display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chips button { padding: 7px 12px; border-radius: 999px; background: var(--s2); border: 1px solid var(--line); font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--t2); }
.chips button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sumgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.platebar { display: flex; align-items: center; justify-content: center; gap: 3px; min-height: 96px; padding: 10px; background: var(--s2); border-radius: 12px; overflow-x: auto; }
.platebar .barend { width: 46px; height: 8px; background: var(--t3); border-radius: 2px; flex: none; }
.platebar .pl { width: 14px; border-radius: 3px; background: var(--accent); display: grid; place-items: center; flex: none; }
.platebar .pl span { font-size: 9px; font-weight: 700; color: var(--accent-ink); writing-mode: vertical-rl; }
.demo-frames { position: relative; aspect-ratio: 3 / 2; border-radius: 12px; overflow: hidden; background: var(--s2); }
.demo-frames img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; max-width: 100%; }
.demo-frames img.f1 { animation: demo-swap 2.8s ease-in-out infinite; }
.demo-frames .pos { position: absolute; left: 10px; bottom: 10px; padding: 3px 9px; border-radius: 999px; background: rgba(0,0,0,.7); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.demo-frames .pos.end { animation: demo-swap 2.8s ease-in-out infinite; }
.demo-frames .pos.start { animation: demo-swap-inv 2.8s ease-in-out infinite; }
.demo-frames.paused img.f1, .demo-frames.paused .pos { animation-play-state: paused; }
@keyframes demo-swap { 0%, 22% { opacity: 0; } 42%, 72% { opacity: 1; } 92%, 100% { opacity: 0; } }
@keyframes demo-swap-inv { 0%, 22% { opacity: 1; } 42%, 72% { opacity: 0; } 92%, 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .demo-frames { aspect-ratio: 3 / 1; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  .demo-frames img { position: static; animation: none; }
  .demo-frames .pos { display: none; }
  * { transition: none !important; }
}
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
#toast { position: fixed; left: 50%; top: 70px; transform: translate(-50%, -20px); z-index: 60; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 380px) {
  .tile .num { font-size: 26px; }
  .sethead, .set { grid-template-columns: 34px minmax(52px, 1fr) minmax(58px, 1fr) minmax(48px, .8fr) 44px; gap: 6px; }
  .bar { grid-template-columns: 78px 1fr 48px; }
}

/* Installed-app adjustments: safe areas, no input zoom, no accidental text selection */
#top { padding-top: env(safe-area-inset-top); }
#nav { height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); }
#app { padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)); }
body.timer-on #app { padding-bottom: calc(var(--nav-h) + 110px + env(safe-area-inset-bottom)); }
body.has-resume #app { padding-bottom: calc(var(--nav-h) + 92px + env(safe-area-inset-bottom)); }
body.in-workout #app { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
body.in-workout.timer-on #app { padding-bottom: calc(120px + env(safe-area-inset-bottom)); }
#resume { bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); }
#timer { bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom)); }
body.in-workout #timer { bottom: calc(12px + env(safe-area-inset-bottom)); }
#toast { top: calc(70px + env(safe-area-inset-top)); }
.sheet-body { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.pin input, .field, select, textarea.notes { font-size: 16px; }
button, a, input, label { touch-action: manipulation; }
body { -webkit-user-select: none; user-select: none; overscroll-behavior-y: none; -webkit-text-size-adjust: 100%; }
input, textarea, .prose, .hist-body { -webkit-user-select: text; user-select: text; }
.demo-frames img { object-fit: contain; }
</style>
</head>
